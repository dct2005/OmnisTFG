<nav class="navbar">
    <div class="logo-container">
        <a routerLink="/">
            <img src="images/logo.webp" alt="Omnis Logo" class="logo">
        </a>
    </div>

    <div class="nav-links">
        <a routerLink="/" class="nav-link" [routerLinkActiveOptions]="{exact: true}"
            routerLinkActive="active">Inicio</a>
        <a routerLink="/catalogo" class="nav-link" routerLinkActive="active">Catálogo</a>
        <a routerLink="/communities" class="nav-link" routerLinkActive="active">Comunidad</a>
        <a routerLink="/soporte" class="nav-link" routerLinkActive="active">Soporte</a>
    </div>

    <div class="auth-buttons">
        @if (isLoggedIn()) {
        <!-- Sección Peppix -->
        <div class="peppix-container" title="Tus Peppix" routerLink="/compras">
            <img src="images/peppix.webp" alt="Peppix Coin" class="peppix-icon">
            <span class="peppix-amount">{{ authService.currentUser()?.peppix || 0 }}</span>
        </div>

        <div class="user-profile-btn" [ngClass]="userEstado" (click)="toggleDropdown()" title="Perfil">
            <div class="user-avatar-wrapper">
                <img [src]="authService.currentUser()?.avatar || authService.currentUser()?.profile_picture || 'https://ui-avatars.com/api/?name=' + usernameValue() + '&background=0d1b2a&color=fff'"
                    class="user-avatar" [alt]="usernameValue()">
            </div>
            <div class="user-info-wrapper">
                <span class="user-name">{{ usernameValue() }}</span>
                <svg class="chevron-icon" [class.rotated]="isDropdownOpen()" viewBox="0 0 24 24" width="20" height="20"
                    fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>

            <!-- Menú Desplegable -->
            @if (isDropdownOpen()) {
            <div class="status-dropdown" (click)="$event.stopPropagation()">
                <div class="status-option" (click)="isDropdownOpen.set(false)">
                    <span>Ver mi perfil</span>
                </div>
                <div class="status-option" routerLink="/account" (click)="isDropdownOpen.set(false)">
                    <span>Detalles de la cuenta</span>
                </div>
                <div class="status-option" [routerLink]="['/catalogo']" [queryParams]="{tab: 'mine'}" (click)="isDropdownOpen.set(false)">
                    <span>Mis Juegos</span>
                </div>
                <div class="status-divider"></div>
                <div class="status-option logout" (click)="logout($event)">
                    <span>Cerrar Sesión</span>
                </div>
            </div>
            }
        </div>
        }
        @else {
        <a routerLink="/login" class="btn btn-primary">Iniciar Sesión</a>
        <a routerLink="/register" class="btn btn-text">Registrarse</a>
        }
    </div>
</nav>
