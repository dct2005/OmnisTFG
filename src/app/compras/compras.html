<div class="compras-page">
    <div class="character left-char">
        <img src="images/peppix-chica.webp" alt="Character Left">
    </div>

    <div class="compras-card">
        <h2 class="compras-title">Compra Peppix</h2>

        <div class="compras-table">
            <div class="table-header">
                <div class="col-price">Precio</div>
                <div class="col-peppix header-peppix">Peppix</div>
                <div class="col-action"></div>
            </div>
            
            <div class="table-divider"></div>

            <div class="table-row">
                <div class="col-price">500,00€</div>
                <div class="col-peppix">
                    <img src="images/peppix.webp" alt="Peppix Icon" class="peppix-icon"> 
                    <span>25.000</span>
                </div>
                <div class="col-action"><button class="btn-buy" (click)="comprar('25.000', '500,00')">Comprar</button></div>
            </div>

            <div class="table-row">
                <div class="col-price">300,00€</div>
                <div class="col-peppix">
                    <img src="images/peppix.webp" alt="Peppix Icon" class="peppix-icon"> 
                    <span>15.000</span>
                </div>
                <div class="col-action"><button class="btn-buy" (click)="comprar('15.000', '300,00')">Comprar</button></div>
            </div>

            <div class="table-row">
                <div class="col-price">100,00€</div>
                <div class="col-peppix">
                    <img src="images/peppix.webp" alt="Peppix Icon" class="peppix-icon"> 
                    <span>5.000</span>
                </div>
                <div class="col-action"><button class="btn-buy" (click)="comprar('5.000', '100,00')">Comprar</button></div>
            </div>

            <div class="table-row">
                <div class="col-price">50,00€</div>
                <div class="col-peppix">
                    <img src="images/peppix.webp" alt="Peppix Icon" class="peppix-icon"> 
                    <span>2.500</span>
                </div>
                <div class="col-action"><button class="btn-buy" (click)="comprar('2.500', '50,00')">Comprar</button></div>
            </div>

            <div class="table-row">
                <div class="col-price">20,00€</div>
                <div class="col-peppix">
                    <img src="images/peppix.webp" alt="Peppix Icon" class="peppix-icon"> 
                    <span>1.000</span>
                </div>
                <div class="col-action"><button class="btn-buy" (click)="comprar('1.000', '20,00')">Comprar</button></div>
            </div>

            <div class="table-row">
                <div class="col-price">10,00€</div>
                <div class="col-peppix">
                    <img src="images/peppix.webp" alt="Peppix Icon" class="peppix-icon"> 
                    <span>500</span>
                </div>
                <div class="col-action"><button class="btn-buy" (click)="comprar('500', '10,00')">Comprar</button></div>
            </div>

            <div class="table-row">
                <div class="col-price">5,00€</div>
                <div class="col-peppix">
                    <img src="images/peppix.webp" alt="Peppix Icon" class="peppix-icon"> 
                    <span>250</span>
                </div>
                <div class="col-action"><button class="btn-buy" (click)="comprar('250', '5,00')">Comprar</button></div>
            </div>
        </div>
    </div>

    <div class="character right-char">
        <img src="images/peppix-chico.webp" alt="Character Right">
    </div>
</div>
