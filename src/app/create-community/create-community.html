<div class="center-wrapper">
    <div class="glass-panel">
        <h1 class="form-title">Crear Comunidad</h1>
        <p class="form-subtitle">Dale vida a un nuevo espacio</p>

        <form (ngSubmit)="onSubmit()" class="form-grid">

            <div class="form-group">
                <label>Nombre de la comunidad <span class="required">*</span></label>
                <input type="text" [(ngModel)]="community.name" name="name" placeholder="Ej: Fans de Star Wars" required
                    class="form-input">
            </div>

            <div class="form-group">
                <label>Categoría <span class="required">*</span></label>
                <div class="select-wrapper">
                    <select [(ngModel)]="community.categoria" name="categoria" required class="form-input">
                        <option value="" disabled selected>Selecciona una categoría</option>
                        <option value="Deportes">Deportes</option>
                        <option value="Entretenimiento">Entretenimiento</option>
                        <option value="Gaming">Gaming</option>
                        <option value="Tecnología">Tecnología</option>
                        <option value="Arte">Arte y Diseño</option>
                        <option value="Música">Música</option>
                        <option value="General">General</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Descripción</label>
                <textarea [(ngModel)]="community.description" name="description"
                    placeholder="¿De qué trata esta comunidad?" rows="3" class="form-input"></textarea>
            </div>

            <div class="form-group">
                <label>Imagen de portada</label>

                <div class="file-upload-box" onclick="document.getElementById('fileInput').click()">
                    @if (imagePreview) {
                    <img [src]="imagePreview" alt="Previsualización" class="preview-img">
                    <div class="change-image-overlay">Cambiar imagen</div>
                    } @else {
                    <span class="upload-icon">📁</span>
                    <p>Haz clic para subir tu portada</p>
                    }
                </div>
                <input type="file" id="fileInput" (change)="onFileSelected($event)" accept="image/*"
                    style="display: none;">
            </div>

            <div class="submit-container">
                <button type="submit" class="btn-create">
                    Lanzar Comunidad
                </button>
            </div>
        </form>
    </div>
</div>
